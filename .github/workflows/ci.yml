name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  select-runner:
    uses: ./.github/workflows/select-local-runner.yml
    with:
      cloud-runner: macos-latest
    secrets:
      status-token: ${{ secrets.LOCAL_RUNNER_STATUS_TOKEN }}

  release-check:
    name: Release readiness
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release readiness checks
        run: pnpm release:check
